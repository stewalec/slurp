{{ define "index" }}
{{ template "head" . }}
{{ template "nav" . }}
<p style="text-align: center;">
<a href="https://github.com/stewalec/slurp">Slurp</a> is a minimal, web-based RSS/Atom feed reader
</p>
<form method="POST" action="/login">
	<fieldset>
		<legend>LOGIN</legend>
		<label for="username">Username:</label>
		<input type="text" name="username" size="42" required>
		<br>
		<label for="password">Password:</label>
		<input type="password" name="password" size="42" required>
		<br>
		<button type="submit">Login</button>
	</fieldset>
</form>
{{ template "tail" . }}
{{ end }}
