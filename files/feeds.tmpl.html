{{ define "feeds" }}
{{ template "head" . }}
{{ template "nav" . }}
<h3>Feeds</h3>

<form method="POST" action="/feeds/submit">
<fieldset>
<legend>Subscribed to <b>{{ len .Data }}</b> feeds</legend>
<textarea name="submit" rows="10" cols="57">
{{ range .Data -}}
{{ .UpdateURL }}
{{ end -}}
</textarea>
<br>
<button type="submit">Subscribe</button>
</fieldset>
</form>
{{ $length := len .Data }}
{{ if gt $length 0 }}
<p>
{{ range .Data -}}
<a href="/feeds/{{ .UpdateURL | escapeURL }}">{{ .UpdateURL }}</a>
{{ end -}}
</p>
{{ end }}
{{ template "tail" . }}
{{ end }}
